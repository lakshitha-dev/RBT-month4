<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AdminFlow — admin dashboard for managing users, metrics and notifications." />
    <meta name="theme-color" content="#4f46e5" />
    <title>AdminFlow</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('adminflow-ui') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>AdminFlow requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
